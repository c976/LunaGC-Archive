# =============================================================================
# 2. World Boss artifacts
# =============================================================================
# CSS maps 48 Boss identities to these templates. Clockwork Mek borrows
# Pyro Regisvine artifact pools until its native data is available.
# Set names are parameters; omitted slots sample the native pieces available
# for each set (the Prayers circlets have no other pieces).
# Rarity, substats, and weights remain explicit; special 5-star slots stay fixed.

world_artifact_1star<...SETS>:
  - type: Artifact
    set: "...$SETS:1"
    rarity: 1
    substats: 0

world_artifact_2star<...SETS>:
  - type: Artifact
    set: "...$SETS:1"
    rarity: 2
    substats: "0:66, 1:34"

world_artifact_3star<...SETS>:
  - type: Artifact
    set: "...$SETS:1"
    rarity: 3
    substats: "1:66, 2:34"

world_artifact_4star<...SETS>:
  - type: Artifact
    set: "...$SETS:1"
    rarity: 4
    substats: "2:66, 3:34"

# Ordinary five-star sets choose a set and an available native slot.
world_artifact_5star:
  - type: Artifact
    set: "gladiators_finale:1, wanderers_troupe:1"
    rarity: 5
    substats: "3:66, 4:34"

# Special native rows link plume/goblet choice with initial substats.
# 17:33 is equivalent to the 34:66 zero-substat variant.
world_artifact_5star_plume_goblet<PLUME_SUBSTATS, GOBLET_SUBSTATS>:
  - type: Artifact
    set: instructor
    slot: plume
    rarity: 5
    substats: $PLUME_SUBSTATS
    weight: 17
  - type: Artifact
    set: instructor
    slot: goblet
    rarity: 5
    substats: $GOBLET_SUBSTATS
    weight: 33

# One explicitly fixed native piece.
world_artifact_5star_goblet<SUBSTATS>:
  - type: Artifact
    set: instructor
    slot: goblet
    rarity: 5
    substats: $SUBSTATS

# =============================================================================
# 3. World Boss ascension gems
# =============================================================================
# Weighted gem candidates by level range and element count.
# CSS controls pool execution counts and fixed rewards independently.
# Template arguments select elements; item counts and candidate weights are unchanged.

# 3.1 Common gem profiles
# The element and rarity fields select one native gem before count is applied.
# Each element carries equal weight. CSS controls independent pool executions.

world_gem_one<...ELEMENTS>:
  - type: Gem
    element: "...$ELEMENTS:1"
    rarity: 2
    count: 3

world_gem_two<COUNT, ...ELEMENTS>:
  - type: Gem
    element: "...$ELEMENTS:1"
    rarity: "2:79, 3:21"
    count: $COUNT

world_gem_three<COUNT, ...ELEMENTS>:
  - type: Gem
    element: "...$ELEMENTS:1"
    rarity: "2:75, 3:20, 4:5"
    count: $COUNT

world_gem_four<COUNT, ...ELEMENTS>:
  - type: Gem
    element: "...$ELEMENTS:1"
    rarity: "2:150, 3:40, 4:10, 5:1"
    count: $COUNT

# 3.2 Additional independent fragment rolls
world_gem_fragment<COUNT, ...ELEMENTS>:
  - type: Gem
    element: "...$ELEMENTS:1"
    rarity: 3
    count: $COUNT
