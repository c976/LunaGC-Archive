# Reward candidate pools used by the bundled reward CSS.
# Source authenticity is unresolved; see docs/rewards/source-provenance.md.
# Historical-reference agreement does not certify original-game reward values.
# Entries select items and properties; CSS controls when and how often pools run.
#
# Known limitations (details in the bundled CSS and source-provenance.md):
# - Clockwork Mek artifacts reuse Pyro Regisvine pools.
# - Some regional puzzle-chest pools fall back to combat-chest sources.
# - Historical-reference regional Mora, EXP and talent-book values cover cities 1-4 only.
# - Some chest weapon/ore pools remain legacy; weekly Boss rewards are not included.
# - Boss probabilities include integer approximations; names and payouts need validation.
#
# Contents
# 1. Chest pools: weapons, ingredients, talent books, artifacts
# 2. World Boss artifacts
# 3. World Boss ascension gems

# =============================================================================
# 1. Chest candidate pools
# =============================================================================

## 1.1 Weapons
# Individual star tiers use equal candidate weights.
weapons_1_star: &weapons_1_star
  - genshin.weapon.dull_blade: 1
  - genshin.weapon.waster_greatsword: 1
  - genshin.weapon.beginners_protector: 1
  - genshin.weapon.apprentices_notes: 1
  - genshin.weapon.hunters_bow: 1

weapons_2_star: &weapons_2_star
  - genshin.weapon.silver_sword: 1
  - genshin.weapon.old_mercs_pal: 1
  - genshin.weapon.iron_point: 1
  - genshin.weapon.pocket_grimoire: 1
  - genshin.weapon.seasoned_hunters_bow: 1

weapons_3_star: &weapons_3_star
  - genshin.weapon.travelers_handy_sword: 1
  - genshin.weapon.ferrous_shadow: 1
  - genshin.weapon.recurve_bow: 1
  - genshin.weapon.otherworldly_story: 1
  - genshin.weapon.messenger: 1

# Mixed weapon tiers. Low/medium/high indicate the relative higher-rarity chance.
weapons_1_to_2_low:
  - {value: *weapons_1_star, weight: 4}
  - {value: *weapons_2_star, weight: 1}
weapons_1_to_2_high:
  - {value: *weapons_1_star, weight: 1}
  - {value: *weapons_2_star, weight: 1}
weapons_2_to_3_low:
  - {value: *weapons_2_star, weight: 3}
  - {value: *weapons_3_star, weight: 2}
weapons_2_to_3_high:
  - {value: *weapons_2_star, weight: 1}
  - {value: *weapons_3_star, weight: 3}
## 1.2 Food ingredients
meat_ingredients:
  - genshin.material.raw_meat: 1
  - genshin.material.fowl: 1

## 1.3 Regional talent books
# Three equal-weight candidates per roll; CSS specifies each region's families and rarity.
regional_talent_books<RARITY, ...SERIES>:
  - type: TalentBook
    series: "...$SERIES:1"
    rarity: $RARITY

## 1.4 Native chest artifacts (sourceType 19, cities 1-4)
# Parameterized candidate sets preserve native rarity and initial substat counts.
# Slot 1~5 selects uniformly; each mixture retains its source relative weights.

chest_artifact<RARITY, SUBSTATS, ...SETS>:
  - type: Artifact
    set: "...$SETS:1"
    slot: "1~5"
    rarity: $RARITY
    substats: $SUBSTATS

