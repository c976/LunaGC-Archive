import org.apache.tools.ant.taskdefs.condition.Os

/*
 * This file was generated by the Gradle 'init' task.
 *
 * This generated file contains a sample Java project to get you started.
 * For more details take a look at the Java Quickstart chapter in the Gradle
 * User Manual available at https://docs.gradle.org/5.6.3/userguide/tutorial_java_projects.html
 */

plugins {
    id 'java' // Apply the java plugin to add support for Java
    id 'java-library' // Apply the java-library plugin for API and implementation separation.
    id 'application' // Apply the application plugin to add support for building a CLI application
    id 'com.diffplug.spotless' version '8.10.4' // Apply the Spotless linter plugin.

    id 'eclipse' // Eclipse Support
    id 'idea' // IntelliJ Support

    id 'maven-publish' // Support for publishing to Maven repositories.
    id 'signing' // Support for signing build artifacts.

    id 'io.freefair.lombok' version '9.8.0' // Lombok for delombok'ification
}

spotless {
    // Keep formatting checks opt-in while upgrading the formatter; explicit
    // spotlessCheck and spotlessApply remain available.
    enforceCheck false
    java {
        // Only format tracked source trees; build/ contains generated protocol and class outputs.
        target files(
                fileTree('src/main/java') {
                    include '**/*.java'
                    exclude 'emu/grasscutter/BuildConfig.java' // Generated during the build.
                },
                fileTree('src/test/java') { include '**/*.java' },
                fileTree('tools/protocol/java') { include '**/*.java' }
        )

        importOrder('io.grasscutter', '', 'java', 'javax', '\\#java', '\\#') // Configure import order.
        googleJavaFormat('1.37.0') // Use Google's Java formatter.
        formatAnnotations() // Reformat annotations.
        endWithNewline() // Ensure files end with a newline.
        leadingSpacesToTabs(2); leadingTabsToSpaces(4) // Use 4 spaces for indentation.
        toggleOffOn() // Toggle off/on.
    }
}

compileJava {
	options.encoding = "UTF-8"
	options.fork = 'true'
	options.forkOptions.with {
		// Protocol Java is generated at build time; keep enough heap for a full clean compile.
		memoryMaximumSize = "6g"
	}
	// Lombok reads these while compiling, so a change to one must not reuse cached classes.
	inputs.files(fileTree('src/main/java') { include '**/lombok.config' }, 'lombok.config')
			.withPropertyName('lombokConfig')
			.withPathSensitivity(PathSensitivity.RELATIVE)
}

compileTestJava.options.encoding = 'UTF-8'

group = 'io.grasscutter'
version = '7.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withJavadocJar()
    withSourcesJar()
}

tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    options.release.set(21)
}

repositories {
    mavenCentral()
}

dependencies {
    // Additional JAR libraries.
    implementation fileTree(dir: 'lib', include: ['*.jar'])

    implementation group: 'it.unimi.dsi', name: 'fastutil', version: '8.5.8'

    // Logging libraries.
    implementation group: 'org.slf4j', name: 'slf4j-api', version: '2.0.7'
    implementation group: 'ch.qos.logback', name: 'logback-core', version: '1.4.7'
    implementation group: 'ch.qos.logback', name: 'logback-classic', version: '1.4.7'

    // Line reading libraries.
    implementation 'org.jline:jline-reader:3.30.14'
    implementation 'org.jline:jline-console:3.30.14'
    implementation 'org.jline:jline-terminal-jna:3.30.14'
    implementation 'info.picocli:picocli:4.7.7'
    implementation('info.picocli:picocli-shell-jline3:4.7.7') {
        exclude group: 'org.jline', module: 'jline'
    }
    implementation group: 'net.java.dev.jna', name: 'jna', version: '5.10.0'

    // Java Netty for networking.
    implementation group: 'io.netty', name: 'netty-common', version: '4.1.86.Final'
    implementation group: 'io.netty', name: 'netty-handler', version: '4.1.86.Final'
    implementation group: 'io.netty', name: 'netty-transport-native-epoll', version: '4.1.86.Final'
    implementation group: 'io.netty', name: 'netty-transport-native-kqueue', version: '4.1.86.Final'

    // Serialization.
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.9.0'
    implementation 'org.tomlj:tomlj:1.1.1'
    implementation 'org.snakeyaml:snakeyaml-engine:3.2'
    implementation group: 'com.google.protobuf', name: 'protobuf-java', version: '4.36.2'
    implementation group: 'com.github.os72', name: 'protobuf-dynamic', version: '1.0.1'

    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.14.2'
    implementation platform('com.fasterxml.jackson:jackson-bom:2.14.0')
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.14.2'

    // Reflections libraries.
    implementation group: 'org.reflections', name: 'reflections', version: '0.10.2'
    implementation group: 'com.esotericsoftware', name: 'reflectasm', version: '1.11.9'
    implementation group: 'com.github.davidmoten', name: 'rtree-multi', version: '0.1'

    // MongoDB object mapper.
    implementation group: 'dev.morphia.morphia', name: 'morphia-core', version: '2.2.7'

    // Utility libraries.
    implementation group: 'org.greenrobot', name: 'eventbus-java', version: '3.3.1'
    // implementation group: 'org.danilopianini', name: 'java-quadtree', version: '0.1.9'

    // Long-term scheduler.
    implementation group: 'org.quartz-scheduler', name: 'quartz', version: '2.3.2'
    implementation group: 'org.quartz-scheduler', name: 'quartz-jobs', version: '2.3.2'

    // Lua script engine library.
    implementation group: 'org.luaj', name: 'luaj-jse', version: '3.0.1'

    // Java HTTP server library.
    implementation group: 'io.javalin', name: 'javalin', version: '5.5.0'
    // Java WebSocket server & client library.
    implementation group: 'org.java-websocket', name: 'Java-WebSocket', version: '1.5.2'
    
    // Xxhash
    implementation group: 'net.openhft', name: 'zero-allocation-hashing', version: '0.26ea0'

    // Testing libraries.
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '5.8.2'
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-params', version: '5.8.2'
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '5.8.2'
    // Gradle 9 no longer supplies the JUnit Platform launcher on the test runtime classpath.
    testRuntimeOnly group: 'org.junit.platform', name: 'junit-platform-launcher', version: '1.8.2'
    testImplementation group: 'org.ow2.asm', name: 'asm', version: '9.5'

    // HTTP client library for testing.
    testImplementation group: 'com.squareup.okhttp3', name: 'okhttp', version: '4.10.0'

    // Lombok.
    compileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.30'
    annotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.30'
    testCompileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.30'
    testAnnotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.30'
}

configurations.configureEach {
    exclude group: 'org.slf4j', module: 'slf4j'
}

application {
    // Define the main class for the application
    getMainClass().set('emu.grasscutter.Grasscutter')
}

jar {
    exclude '*.proto'

    // Optional benchmark for local packaging speed; the default release JAR
    // remains compressed and retains its original file name and contents.
    if (project.hasProperty('fastJar')) {
        entryCompression = org.gradle.api.tasks.bundling.ZipEntryCompression.STORED
    }

    manifest {
        attributes 'Main-Class': 'emu.grasscutter.Grasscutter'
    }

    archiveBaseName = 'grasscutter'
    if (project.hasProperty('jarFilename')) {
        // archiveExtension is a lazy Property, so interpolating it directly stringifies the
        // property itself and the jar lands under a filename containing its description.
        archiveFileName = "${jarFilename}.${archiveExtension.get()}"
    }

    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }

    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    from('src/main/java') {
        include '*.xml'
    }

    destinationDirectory = file('.')
}

test {
    // Load the lightweight server resource fixture before server-backed unit test classes.
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
    useJUnitPlatform {
        // GrasscutterTest boots a real server, so it needs MongoDB and the resources pack, which
        // is gitignored. A fresh checkout cannot run it. Tagging lets CI ask for the tests that
        // stand on their own (-PexcludeTags=integration) while a plain `gradlew test` still runs
        // everything for anyone who has a working server checkout.
        if (project.hasProperty('excludeTags')) {
            excludeTags project.property('excludeTags').split(',')
        }
    }
    // A JVM can exit before writing XML reports; log the last started test to diagnose it.
    testLogging {
        events 'started', 'failed'
    }
    setMaxHeapSize('4G')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'grasscutter'
            from components.java
            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }

            pom {
                name = 'Grasscutter'
                description = 'A server software reimplementation for an anime game.'
                url = 'https://github.com/Grasscutters/Grasscutter'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'meledy'
                        name = 'Meledy'
                        email = 'meledy@grasscutter.io' // not a real email kek
                    }
                }
                scm {
                    connection = 'scm:git:git@github.com:Grasscutters/Grasscutter.git'
                    developerConnection = 'scm:git:ssh://github.com/Grasscutters/Grasscutter.git'
                    url = 'https://github.com/Grasscutters/Grasscutter'
                }
            }
        }
    }

    repositories {
        maven {
            if (version.endsWith('-dev')) {
                // Check if the action being ran is 'publish'.
                if (publish.state.executing) {
                    println('Publishing to Ben4J-Maven')
                }

                url 'https://repo.4benj.com/releases'
                name '4benj-maven'
                credentials {
                    username System.getenv('benj_maven_username')
                    password System.getenv('benj_maven_token')
                }
            } else {
                // Check if the action being ran is 'publish'.
                if (publish.state.executing) {
                    println('Publishing to Sonatype')
                }

                def releasesRepoUrl = 'https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/'
                def snapshotsRepoUrl = 'https://s01.oss.sonatype.org/content/repositories/snapshots/'
                url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl

                name = 'sonatype'
                credentials(PasswordCredentials)
            }
        }
    }
}

signing {
    if (!version.endsWith('-dev')) {
        sign publishing.publications.mavenJava
    }
}

javadoc {
    options.encoding = 'UTF-8'
    if (JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }

    // Add this to avoid warning caused by lack of comments in proto generated java files
    options.addStringOption('Xdoclint:none', '-quiet')
    // Delombok copies per-package lombok.config files into its generated source tree.
    // Javadoc treats those as package names unless they are explicitly excluded.
    exclude '**/lombok.config'
    exclude '**/*.md'
    exclude 'src/handbook/**/*.*'
}

// Keep compiler inputs stable between commits. The Git revision is packaged as
// a resource, not embedded into a generated Java constant.
def buildVersion = project.version.toString()
def buildConfigSource = layout.projectDirectory.file('src/main/java/emu/grasscutter/BuildConfig.java')
def buildDateTime = providers.provider {
    java.time.Instant.now()
        .truncatedTo(java.time.temporal.ChronoUnit.SECONDS)
        .toString()
}
tasks.register('generateBuildConfig') {
    inputs.property('version', buildVersion)
    inputs.property('buildDatetime', buildDateTime)
    outputs.file(buildConfigSource)

    doLast {
        def target = buildConfigSource.asFile
        def generated = """package emu.grasscutter;

import java.io.IOException;
import java.util.Properties;

public final class BuildConfig {
    public static final String VERSION = "${buildVersion}";
    public static final String GIT_HASH = readGitHash();
    public static final String BUILD_DATETIME = "${buildDateTime.get()}";

    private BuildConfig() {}

    private static String readGitHash() {
        try (var stream = BuildConfig.class.getResourceAsStream("/META-INF/astaps-build.properties")) {
            if (stream == null) {
                return "GIT_NOT_FOUND";
            }
            var properties = new Properties();
            properties.load(stream);
            return properties.getProperty("gitHash", "GIT_NOT_FOUND");
        } catch (IOException ignored) {
            return "GIT_NOT_FOUND";
        }
    }
}
"""
        if (!target.exists() || target.getText('UTF-8') != generated) {
            target.parentFile.mkdirs()
            target.setText(generated, 'UTF-8')
        }
    }
}

def gitHash = file('.git').isDirectory()
    ? providers.exec {
        commandLine 'git', 'rev-parse', '--verify', '--short', 'HEAD'
      }.standardOutput.asText.map { it.trim() }
    : providers.provider { 'unknown' }

def buildMetadataDirectory = layout.buildDirectory.dir('generated/resources/buildMetadata')
def buildMetadataTask = tasks.register('generateBuildMetadata') {
    inputs.property('gitHash', gitHash)
    outputs.dir(buildMetadataDirectory)
    doLast {
        def target = buildMetadataDirectory.get().file('META-INF/astaps-build.properties').asFile
        target.parentFile.mkdirs()
        def metadata = "gitHash=${gitHash.get()}\n"
        if (!target.exists() || target.getText('UTF-8') != metadata) {
            target.setText(metadata, 'UTF-8')
        }
    }
}

// The resource is available to application/run/test and included in the fat JAR.
sourceSets.main.output.dir([builtBy: buildMetadataTask], buildMetadataDirectory)
tasks.named('compileJava') {
    dependsOn 'generateBuildConfig'
}
// The source archive reads BuildConfig.java generated directly into src/main/java.
tasks.named('sourcesJar') {
    dependsOn 'generateBuildConfig'
}

// Handbook dependencies are installed only when explicitly requested, not during configuration.
tasks.register('generateHandbook', Exec) {
    def npm = Os.isFamily(Os.FAMILY_WINDOWS) ? 'npm.cmd' : 'npm'
    def handbookDir = file('src/handbook')
    def requiredData = [
        'commands.json', 'avatars.csv', 'entities.csv', 'items.csv',
        'mainquests.csv', 'quests.csv', 'scenes.csv',
    ].collect { new File(handbookDir, "data/${it}") }
    def skipHandbook = project.hasProperty('skipHandbook')

    workingDir handbookDir
    commandLine npm, 'install'
    onlyIf {
        if (skipHandbook || !requiredData.every { it.isFile() }) {
            return false
        }
        try {
            def process = new ProcessBuilder(npm, '--version').redirectErrorStream(true).start()
            process.inputStream.readAllBytes()
            return process.waitFor() == 0
        } catch (Exception ignored) {
            return false
        }
    }
}

delombok {
    dependsOn 'generateProtocolJava'
}

// For terminal interacting in IDEA running
run {
    standardInput = System.in
}

apply from: 'gradle/protocol-generation.gradle'
