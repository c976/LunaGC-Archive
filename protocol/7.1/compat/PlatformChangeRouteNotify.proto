syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "PlatformInfo.proto";

// 7.1 CmdId 6989 and field numbers from kitkat-multiverse/genshin-protocol 7.1.0.
message PlatformChangeRouteNotify {
  PlatformInfo platform = 4;
  uint32 entity_id = 6;
  uint32 scene_time = 7;
}
