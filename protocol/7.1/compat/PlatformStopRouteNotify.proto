syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "PlatformInfo.proto";

// 7.1 CmdId 4699 and field numbers from kitkat-multiverse/genshin-protocol 7.1.0.
message PlatformStopRouteNotify {
  PlatformInfo platform = 12;
  uint32 entity_id = 5;
  uint32 scene_time = 14;
}
